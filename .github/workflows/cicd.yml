name: DevPilot CI/CD

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: devpilot-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/devpilot
  TRIVY_VERSION: '0.65.0'

jobs:
  quality:
    name: Test all components
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: devpilot-web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: devpilot-agent/go.mod
          cache-dependency-path: devpilot-agent/go.sum
      - name: Server tests
        working-directory: devpilot-server
        run: mvn -B test
      - name: Web type-check and build
        working-directory: devpilot-web
        run: npm ci && npm test && npm run type-check && npm run build
      - name: Agent tests
        working-directory: devpilot-agent
        run: go test -race ./...

  security:
    name: Security gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan source, dependencies, secrets and IaC
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            "aquasec/trivy:${TRIVY_VERSION}" fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed .

  images:
    name: Build ${{ matrix.component }} image
    needs: [quality, security]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            context: devpilot-server
            file: devpilot-server/Dockerfile
          - component: web
            context: .
            file: devpilot-web/Dockerfile
          - component: agent
            context: devpilot-agent
            file: devpilot-agent/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute immutable image tag
        id: version
        shell: bash
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Check immutable image tag
        id: existing
        if: github.event_name != 'pull_request'
        env:
          IMAGE_URI: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ steps.version.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE_URI" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify existing multi-platform image
        if: github.event_name != 'pull_request' && steps.existing.outputs.exists == 'true'
        env:
          IMAGE_URI: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ steps.version.outputs.tag }}
        run: |
          docker buildx imagetools inspect "$IMAGE_URI" --raw | jq -e '
            [.manifests[]?.platform.architecture] as $architectures
            | ($architectures | index("amd64")) != null
            and ($architectures | index("arm64")) != null
          '
      - uses: docker/build-push-action@v6
        if: github.event_name == 'pull_request' || steps.existing.outputs.exists != 'true'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  report-and-deploy:
    name: Report gates and request deployment
    needs: [quality, security, images]
    # workflow_dispatch is the explicit human production approval gate. Plans
    # that support environment reviewers can enforce a second approval here.
    if: always() && github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    environment: production
    env:
      DEVPILOT_CICD_CALLBACK_URL: ${{ secrets.DEVPILOT_CICD_CALLBACK_URL }}
      DEVPILOT_CICD_CALLBACK_SECRET: ${{ secrets.DEVPILOT_CICD_CALLBACK_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - name: Install callback dependencies
        run: sudo apt-get update && sudo apt-get install -y jq openssl
      - name: DevPilot callback is not configured
        if: env.DEVPILOT_CICD_CALLBACK_URL == '' || env.DEVPILOT_CICD_CALLBACK_SECRET == ''
        run: |
          echo "::error::Production release requires both DevPilot callback secrets. No deployment was requested."
          exit 1
      - name: Report result to DevPilot
        if: env.DEVPILOT_CICD_CALLBACK_URL != '' && env.DEVPILOT_CICD_CALLBACK_SECRET != ''
        env:
          CI_EXTERNAL_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_BRANCH: ${{ github.ref_name }}
          CI_PIPELINE_STATUS: ${{ needs.quality.result == 'success' && needs.security.result == 'success' && needs.images.result == 'success' && 'SUCCEEDED' || 'FAILED' }}
          CI_TEST_STATUS: ${{ needs.quality.result == 'success' && 'PASSED' || 'FAILED' }}
          CI_SECURITY_STATUS: ${{ needs.security.result == 'success' && 'PASSED' || 'FAILED' }}
          # The acceptance target must be independently runnable by the
          # deployment provider. The web image exposes /healthz without
          # requiring the control plane's MySQL and Redis dependencies.
          CI_IMAGE_URI: ${{ env.IMAGE_PREFIX }}-web
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_SUMMARY: GitHub Actions quality, security and image gates
        run: |
          export CI_IMAGE_URI="$CI_IMAGE_URI:sha-${GITHUB_SHA::12}"
          if [[ "$CI_PIPELINE_STATUS" != SUCCEEDED ]]; then unset CI_IMAGE_URI; fi
          bash scripts/cicd/notify-devpilot.sh
