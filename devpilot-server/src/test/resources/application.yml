spring:
  datasource:
    url: jdbc:h2:mem:devpilot;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      repositories:
        enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

devpilot:
  security:
    jwt-secret: test-secret-must-be-at-least-thirty-two-bytes
    access-token-ttl: 15m
    refresh-token-ttl: 1d
    refresh-cookie-secure: false
    refresh-cookie-name: dp_refresh_token
    settings-encryption-key: test-master-key-must-be-at-least-thirty-two-bytes
  agent:
    heartbeat-interval: 10s
    heartbeat-timeout: 30s
    public-url: http://localhost:8080
  maintenance:
    report-secret: test-maintenance-report-secret-at-least-thirty-two-bytes
    backup-freshness: 26h
  observability:
    prometheus-scrape-token: ""
    snapshot-interval-ms: 30000
