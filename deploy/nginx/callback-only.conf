limit_req_zone $binary_remote_addr zone=devpilot_callback_rate:10m rate=30r/m;

server {
    listen 8080;
    server_name _;

    access_log off;
    server_tokens off;
    client_max_body_size 64k;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # The temporary acceptance tunnel exposes only signed CI callbacks. The
    # DevPilot console, authentication endpoints, and every other API remain
    # unreachable through this gateway.
    location ~ "^/api/cicd/webhooks/[A-Za-z0-9_-]{1,64}$" {
        limit_except POST { deny all; }
        limit_req zone=devpilot_callback_rate burst=10 nodelay;

        proxy_pass http://host.docker.internal:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
