server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(install|install-agent)\.sh$ {
        default_type text/plain;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location /downloads/ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        # Controlled CI/CD acceptance drill: this commit must trigger the
        # DevPilot health gate and automatic rollback to the prior image.
        return 503 'rollback-drill';
    }
}
